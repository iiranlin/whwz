apiVersion: v1
kind: ConfigMap
metadata:
  name: rmmis-warehouse-front-integrate-vue3-front-dev
data:
  default.conf: |+
    client_max_body_size 100m;
    
    add_header "X-Frame-Options" "sameorigin";  
    add_header "X-XSS-Protection" "1; mode=block";
    add_header "Access-Control-Allow-Origin" * always;
    add_header "Access-Control-Allow-Credentials" true;
    
    gzip on;
    
    server{
        listen 80;
        server_name localhost;
        
        location / {
            root   /dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            error_page 405 =200 $request_uri;
            if ($uri ~ \.html$) {
            	 add_header Cache-Control "no-cache,no-store, must-revalidate";
            }
        }
        
        location @router {
            rewrite ^.*$ /index.html last;
        }
        
    }
    
    
---
apiVersion: v1
kind: Service
metadata:
  name: rmmis-warehouse-front-integrate-vue3-front-dev
  labels:
    app: rmmis-warehouse-front-integrate-vue3-front-dev
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: rmmis-warehouse-front-integrate-vue3-front-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmmis-warehouse-front-integrate-vue3-front-dev
  labels:
    app: rmmis-warehouse-front-integrate-vue3-front-dev 
spec:
  selector:
    matchLabels:
      app: rmmis-warehouse-front-integrate-vue3-front-dev
  replicas: 1
  template:
    metadata:
      labels:
        app: rmmis-warehouse-front-integrate-vue3-front-dev
    spec:
      containers:
        - name: rmmis-warehouse-front-integrate-vue3-front-dev
          image: 10.3.36.124:9200/rmmis-warehouse/rmmis-warehouse-front-integrate-vue3-front:203
          imagePullPolicy: Always
          ports:
          - containerPort: 80
          volumeMounts:
          - name: frontend-config
            mountPath:  /etc/nginx/conf.d/
            readOnly: true
      volumes:
        - name: frontend-config
          configMap:
            name: rmmis-warehouse-front-integrate-vue3-front-dev
            items:
            - key: "default.conf"
              path: default.conf